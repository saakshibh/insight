<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - NextWave Insights</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">NextWave Insights</div>
    <nav class="nav-buttons">
      <button onclick="navigateTo('index.html')">Home</button>
    </nav>
  </header>

  <main style="display: flex; justify-content: center; margin-top: 60px;">
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 12px rgba(0,0,0,0.1); width: 350px;">
      <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>
      <input type="text" placeholder="Email" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 6px; border: 1px solid #ccc;" />
      <input type="password" placeholder="Password" style="width: 100%; margin-bottom: 20px; padding: 10px; border-radius: 6px; border: 1px solid #ccc;" />
      <button style="width: 100%; padding: 10px; background-color: #00d4ff; border: none; color: black; border-radius: 6px;">Login</button>
      <p style="text-align: center; margin-top: 15px;">
        Don't have an account? <a href="#">Register</a>
      </p>
    </div>
  </main>
  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
  
      const username = form.username.value;
      const password = form.password.value;
  
      const response = await fetch('http://localhost:5000/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, password })
      });
  
      const result = await response.json();
  
      if (response.ok) {
        alert(result.message); // Login successful
      } else {
        alert(result.message); // Invalid username or password
      }
    });
  </script>
  <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
</body>
</html>
